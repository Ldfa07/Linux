<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Non Trouvée</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #0f0;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
        }

        /* Effet de pluie Matrix */
        .matrix-rain {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .matrix-column {
            position: absolute;
            width: 20px;
            height: 100%;
            text-shadow: 0 0 5px #0f0;
            animation: rain 10s linear infinite;
            opacity: 0.8;
        }

        .matrix-column span {
            display: block;
            font-size: 16px;
            line-height: 1.2;
        }

        @keyframes rain {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }

        .content {
            position: relative;
            z-index: 1;
            max-width: 800px;
            padding: 20px;
        }

        .error-title {
            font-size: 72px;
            margin: 0;
            text-shadow: 0 0 10px #0f0;
            animation: glow 2s ease-in-out infinite alternate;
        }

        .error-subtitle {
            font-size: 24px;
            margin: 20px 0;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .error-message {
            font-size: 16px;
            margin: 20px 0;
            color: #0a0;
        }

        a {
            color: #0f0;
            text-decoration: none;
            font-weight: bold;
            border: 1px solid #0f0;
            padding: 10px 20px;
            transition: all 0.3s;
        }

        a:hover {
            background-color: #0f0;
            color: #000;
            box-shadow: 0 0 15px #0f0;
        }

        @keyframes glow {
            0% { text-shadow: 0 0 5px #0f0; }
            100% { text-shadow: 0 0 20px #0f0, 0 0 30px #0f0; }
        }
    </style>
</head>
<body>
    <div class="matrix-rain" id="matrixRain"></div>

    <div class="content">
        <h1 class="error-title">404</h1>
        <h2 class="error-subtitle">ERROR: PAGE NOT FOUND</h2>
        <p class="error-message">The page you are looking for does not exist or has been moved.</p>
        <p><a href="/">RETURN TO REALITY</a></p>
    </div>

    <script>
        // Génération de l'effet Matrix
        const matrixRain = document.getElementById('matrixRain');
        const characters = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        const columns = Math.floor(window.innerWidth / 20);

        for (let i = 0; i < columns; i++) {
            const column = document.createElement('div');
            column.className = 'matrix-column';

            // Position aléatoire pour chaque colonne
            column.style.left = `${i * 20}px`;
            column.style.animationDelay = `${Math.random() * 10}s`;
            column.style.animationDuration = `${5 + Math.random() * 10}s`;

            // Génération des caractères pour chaque colonne
            const columnHeight = Math.floor(window.innerHeight / 16);
            for (let j = 0; j < columnHeight + 20; j++) {
                const span = document.createElement('span');
                span.textContent = characters[Math.floor(Math.random() * characters.length)];
                column.appendChild(span);
            }

            matrixRain.appendChild(column);
        }

        // Redimensionnement
        window.addEventListener('resize', () => {
            matrixRain.innerHTML = '';
            const newColumns = Math.floor(window.innerWidth / 20);
            for (let i = 0; i < newColumns; i++) {
                const column = document.createElement('div');
                column.className = 'matrix-column';
                column.style.left = `${i * 20}px`;
                column.style.animationDelay = `${Math.random() * 10}s`;
                column.style.animationDuration = `${5 + Math.random() * 10}s`;

                const columnHeight = Math.floor(window.innerHeight / 16);
                for (let j = 0; j < columnHeight + 20; j++) {
                    const span = document.createElement('span');
                    span.textContent = characters[Math.floor(Math.random() * characters.length)];
                    column.appendChild(span);
                }
                matrixRain.appendChild(column);
            }
        });
    </script>
</body>
</html>
